name: Merge Lane

on:
  workflow_call:

permissions: {}

jobs:
  lane:
    name: Merge lane
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: write
    concurrency:
      group: merge-lane-${{ github.event.pull_request.head.repo.full_name || github.event.workflow_run.head_repository.full_name }}:${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
      cancel-in-progress: false
      queue: max
    env:
      TEST_STRENGTH_MODE: ${{ vars.TEST_STRENGTH_MODE }}
      BLIND_CHECKS_MODE: ${{ vars.BLIND_CHECKS_MODE }}
    steps:
      - name: Check out the settings and package manifests from the base branch
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.workflow_run.pull_requests[0].base.ref || github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags --depth=1 --filter=blob:none origin "refs/heads/$BASE_REF"
          git sparse-checkout set --no-cone '/.github/agent-trust.json' '/pnpm-workspace.yaml' 'package.json'
          git checkout -q --detach FETCH_HEAD

      - name: Fetch agent-trust at the commit this workflow runs from
        shell: bash
        env:
          TOOL_REPOSITORY: ${{ job.workflow_repository }}
          TOOL_SHA: ${{ job.workflow_sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/agent-trust"
          git init -q "$tool"
          git -C "$tool" fetch -q --no-tags --depth=1 "${GITHUB_SERVER_URL}/${TOOL_REPOSITORY}.git" "$TOOL_SHA"
          git -C "$tool" checkout -q --detach FETCH_HEAD

      - name: Judge the lane and test strength, and sync the labels
        uses: actions/github-script@v8
        with:
          script: |
            const { syncPullRequest } = require(`${process.env.RUNNER_TEMP}/agent-trust/lib/merge-lane.cjs`);
            await syncPullRequest({ github, context, core, root: process.env.GITHUB_WORKSPACE });
