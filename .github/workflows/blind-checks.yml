name: Blind Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  proof:
    name: Blind checks
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    concurrency:
      group: blind-checks-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BLIND_CHECKS_MODE: ${{ vars.BLIND_CHECKS_MODE }}
    steps:
      - name: Fetch agent-trust at the commit this workflow runs from
        shell: bash
        env:
          TOOL_REPOSITORY: ${{ job.workflow_repository }}
          TOOL_SHA: ${{ job.workflow_sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/agent-trust"
          git init -q "$tool"
          git -C "$tool" fetch -q --no-tags --depth=1 "${GITHUB_SERVER_URL}/${TOOL_REPOSITORY}.git" "$TOOL_SHA"
          git -C "$tool" checkout -q --detach FETCH_HEAD

      - name: Fetch the pull request commits and the settings from the base branch
        id: fetch
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags --filter=tree:0 origin "$HEAD_SHA" "+refs/heads/$BASE_REF:refs/remotes/origin/base"
          tip="$(git rev-parse refs/remotes/origin/base)"
          base="$(git merge-base "$tip" "$HEAD_SHA")"
          first="$(git rev-list --reverse --first-parent "$base..$HEAD_SHA" | sed -n 1p)"
          mkdir -p "$RUNNER_TEMP/proof"
          if git cat-file -e "$tip:.github/agent-trust.json" 2>/dev/null; then
            git show "$tip:.github/agent-trust.json" > "$RUNNER_TEMP/settings.json"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "first=$first" >> "$GITHUB_OUTPUT"

      - name: Find the checks
        id: plan
        shell: bash
        env:
          PROOF_BASE: ${{ steps.fetch.outputs.base }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/agent-trust/lib/blind-checks.cjs" plan --base "$PROOF_BASE" --head "$HEAD_SHA" \
            --dir "$RUNNER_TEMP/proof" --settings "$RUNNER_TEMP/settings.json" \
            --pr-base "$BASE_REF" --default-branch "$DEFAULT_BRANCH"

      - name: Check out the base code
        if: steps.plan.outputs.run == 'true'
        env:
          PROOF_BASE: ${{ steps.fetch.outputs.base }}
        run: git checkout -q --detach "$PROOF_BASE"

      - name: Set up Node
        if: steps.plan.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.plan.outputs.node }}

      - name: Install on the base code
        if: steps.plan.outputs.run == 'true'
        shell: bash
        env:
          INSTALL: ${{ steps.plan.outputs.install }}
        run: bash -euo pipefail -c "$INSTALL"

      - name: Run the old checks on the base code
        if: steps.plan.outputs.run == 'true'
        timeout-minutes: 5
        shell: bash
        run: |
          node "$RUNNER_TEMP/agent-trust/lib/blind-checks.cjs" test --settings "$RUNNER_TEMP/settings.json" \
            --files "$RUNNER_TEMP/proof/base-files.txt" --out "$RUNNER_TEMP/proof/baseline.json"

      - name: Bring in the checks from the head
        if: steps.plan.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.files[].file, .support[]?' "$RUNNER_TEMP/proof/plan.json" | tr '\n' '\0' | xargs -0 git checkout -q "$HEAD_SHA" --

      - name: Run the checks without the code
        if: steps.plan.outputs.run == 'true'
        timeout-minutes: 5
        shell: bash
        run: |
          node "$RUNNER_TEMP/agent-trust/lib/blind-checks.cjs" test --settings "$RUNNER_TEMP/settings.json" \
            --files "$RUNNER_TEMP/proof/files.txt" --out "$RUNNER_TEMP/proof/before.json"

      - name: Check out the pull request head
        if: steps.plan.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git checkout -q --detach "$HEAD_SHA"
          changed="$(git status --porcelain)"
          if [[ -n "$changed" ]]; then
            echo "::error::A check left changed or new files in the repo while it ran without the code, so the run with the code would not use the pull request's own files. Write temp files to the system temp folder, or clean up in a finally block."
            echo "$changed"
            exit 1
          fi

      - name: Install on the pull request head
        if: steps.plan.outputs.run == 'true'
        shell: bash
        env:
          INSTALL: ${{ steps.plan.outputs.install }}
        run: bash -euo pipefail -c "$INSTALL"

      - name: Run the checks with the code
        if: steps.plan.outputs.run == 'true'
        timeout-minutes: 5
        shell: bash
        run: |
          node "$RUNNER_TEMP/agent-trust/lib/blind-checks.cjs" test --settings "$RUNNER_TEMP/settings.json" \
            --files "$RUNNER_TEMP/proof/files.txt" --out "$RUNNER_TEMP/proof/after.json"

      - name: Judge
        if: steps.plan.outputs.run == 'true'
        run: node "$RUNNER_TEMP/agent-trust/lib/blind-checks.cjs" judge --dir "$RUNNER_TEMP/proof"

      - name: Measure test strength
        id: strength
        if: steps.plan.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        env:
          PROOF_BASE: ${{ steps.fetch.outputs.base }}
          FIRST_SHA: ${{ steps.fetch.outputs.first }}
          TEST_STRENGTH_MODE: ${{ vars.TEST_STRENGTH_MODE }}
        run: |
          node "$RUNNER_TEMP/agent-trust/lib/test-strength.cjs" measure --settings "$RUNNER_TEMP/settings.json" \
            --first "$FIRST_SHA" --base "$PROOF_BASE" --head "$HEAD_SHA" --out "$RUNNER_TEMP/strength"

      - name: Upload the test strength measurement
        if: always() && steps.strength.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-strength
          path: ${{ runner.temp }}/strength/measurement.json
          if-no-files-found: ignore
          retention-days: 14
